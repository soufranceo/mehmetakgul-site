<!DOCTYPE html>

<head>

  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1116; color: #f4efe7; font-family: Inter, sans-serif; text-align: center; padding: 2rem; }

    a { display: inline-block; margin-top: 2rem; color: #0e1116; background: #c8a46a; padding: 1rem 2rem; border-radius: 999px; text-decoration: none; font-weight: 500; }

<body>
  <div>
    <h1>Mesajınız <em>alındı.</em></h1>
